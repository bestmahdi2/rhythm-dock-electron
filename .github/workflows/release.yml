name: Build and Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Reserve release tag before builds
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reserve the exact source commit
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash "Rhythm Dock/scripts/prepare-release.sh"

  validate:
    name: Validate and test
    runs-on: windows-2022
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Rhythm Dock/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check version consistency
        id: version
        shell: bash
        run: node "Rhythm Dock/scripts/release-artifacts.js" version >> "$GITHUB_OUTPUT"
      - name: Install app dependencies
        run: npm ci
        working-directory: Rhythm Dock
      - name: Install server test dependencies
        run: npm install --ignore-scripts --package-lock=false
        working-directory: server
      - name: Generate icons
        run: npm run icons
        working-directory: Rhythm Dock
      - name: Run tests and database preservation checks
        run: npm test
        working-directory: Rhythm Dock

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            args: --win nsis portable --x64
          - name: windows-ia32
            os: windows-2022
            args: --win nsis portable --ia32
          - name: windows-arm64
            os: windows-11-arm
            args: --win nsis portable --arm64
          - name: macos-x64
            os: macos-15-intel
            args: --mac dmg zip --x64
          - name: macos-arm64
            os: macos-15
            args: --mac dmg zip --arm64
          - name: linux-x64
            os: ubuntu-24.04
            args: --linux AppImage deb rpm tar.gz --x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            args: --linux AppImage deb rpm tar.gz --arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Rhythm Dock/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools fakeroot
      - name: Install dependencies for the native runner architecture
        run: npm ci
        working-directory: Rhythm Dock
      - name: Generate application and file-type icons
        run: npm run icons
        working-directory: Rhythm Dock
      - name: Build installer and portable packages
        run: npx electron-builder ${{ matrix.args }} --publish never
        working-directory: Rhythm Dock
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify artifact set and write checksums
        run: node scripts/release-artifacts.js collect ${{ matrix.name }}
        working-directory: Rhythm Dock
      - uses: actions/upload-artifact@v4
        with:
          name: rhythm-dock-${{ matrix.name }}
          path: Rhythm Dock/dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned release
    needs: [prepare-release, validate, build]
    if: needs.prepare-release.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-rhythm-dock-${{ needs.validate.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: rhythm-dock-*
          path: release
          merge-multiple: true
      - name: Publish packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-list -n 1 "$tag")" = "$GITHUB_SHA"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "Rhythm Dock $VERSION" --notes-file "Rhythm Dock/docs/release-notes.md" --draft
          fi
          gh release upload "$tag" release/* --clobber
          gh release edit "$tag" --draft=false --latest
          echo "Published [$tag](https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag)" >> "$GITHUB_STEP_SUMMARY"
