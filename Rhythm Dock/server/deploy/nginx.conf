# /etc/nginx/sites-available/rhythm-dock
#
# Reverse proxy with TLS termination. The WebSocket upgrade headers are the part
# people usually miss: without them the socket handshake fails with a 400 and the
# app appears to "connect and immediately drop".

upstream rhythm_dock {
    server 127.0.0.1:8420;
    keepalive 32;
}

# Redirect plain HTTP to HTTPS. Browsers refuse to open a ws:// socket from an
# https:// page, so a mixed setup silently breaks the phone client.
server {
    listen 80;
    listen [::]:80;
    server_name music.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name music.example.com;

    ssl_certificate     /etc/letsencrypt/live/music.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Audio is relayed in chunks; buffering it here would add latency and memory use
    # for no benefit, and would break range requests.
    proxy_buffering off;
    proxy_request_buffering off;

    # A track can be tens of megabytes.
    client_max_body_size 64m;

    location / {
        proxy_pass http://rhythm_dock;
        proxy_http_version 1.1;

        # --- WebSocket upgrade. Required for /ws. ---
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Range requests must reach the app untouched or seeking breaks.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # A listening session is a long-lived socket. The default 60s read timeout
        # would drop every idle member once a minute.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_connect_timeout 10s;
    }
}

# Add this to the http{} block in /etc/nginx/nginx.conf if it is not already present.
# It maps a missing Upgrade header to "close" instead of an empty value, which some
# clients reject:
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
