<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; media-src 'self' data:; connect-src 'self' https://lrclib.net;">
    <link rel="stylesheet" href="styles/app.css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Rhythm Dock</title>
    <link rel="stylesheet" href="styles/icons.css"/>
</head>
<body>
<div id="container" class="container">

    <img id="album-art" src="../assets/images/placeholder.png" alt="Album Art"/>

    <div class="track-info">
        <div id="title">No song loaded</div>
        <div id="artist">Open a file or folder</div>
    </div>

    <div class="sliders">
        <input id="progress-bar" type="range" min="0" value="0" step="0.1"/>
        <div class="time-display">
            <span id="time-current">0:00</span>
            <span id="time-remaining">-0:00</span>
        </div>
    </div>

    <div class="playback-buttons">
        <button id="prev-btn" title="Previous">
            <svg class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 5v14M19 5 9 12l10 7Z"></path></svg>
        </button>
        <button id="play-pause-btn" title="Play/Pause">
            <svg id="play-icon" class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5 19 12 8 19Z"></path></svg>
            <svg id="pause-icon" style="display: none;" class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5v14M16 5v14"></path></svg>
        </button>
        <button id="next-btn" title="Next">
            <svg class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 5v14M5 5l10 7-10 7Z"></path></svg>
        </button>
    </div>

    <div class="volume-container">
        <button id="volume-btn" title="Mute">
            <svg id="volume-icon" class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 4 6 9H2v6h4l5 5ZM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"></path></svg>
            <svg id="volume-mute-icon" style="display: none;" class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 4 6 9H2v6h4l5 5ZM17 9l6 6m0-6-6 6"></path></svg>
        </button>
        <input id="volume-slider" type="range" min="0" max="1" value="1" step="0.05"/>
    </div>

    <div class="header-bar">
        <div id="filename" class="filename" style="display: none;"></div>
        <div class="window-controls">
            <button id="shuffle-btn" title="Shuffle">
                <svg class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m17 3 4 4-4 4M3 17l5-5M14 7h7M3 7h4l10 10h4m-4-4 4 4-4 4"></path></svg>
            </button>
            <button id="loop-btn" title="Loop Off">
                <svg id="loop-off-icon" class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m17 2 4 4-4 4M3 11V8a2 2 0 0 1 2-2h16M7 22l-4-4 4-4M21 13v3a2 2 0 0 1-2 2H3"></path></svg>
                <svg id="loop-all-icon" style="display: none;" class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m17 2 4 4-4 4M3 11V8a2 2 0 0 1 2-2h16M7 22l-4-4 4-4M21 13v3a2 2 0 0 1-2 2H3"></path></svg>
                <svg id="loop-one-icon" style="display: none;" class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m17 2 4 4-4 4M3 11V8a2 2 0 0 1 2-2h16M7 22l-4-4 4-4M21 13v3a2 2 0 0 1-2 2H3M10 10l2-1v6"></path></svg>
            </button>
            <button id="orientation-btn" class="control-btn" title="Change Orientation">
                <svg class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 3h18v18H3ZM9 3v18"></path></svg>
            </button>
            <button id="pin-btn" title="Pin Window">
                <svg class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 3h6M9 3v6l-3 4v2h12v-2l-3-4V3M12 15v7"></path></svg>
            </button>
            <button id="minimize-btn" title="Minimize">
                <svg class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14"></path></svg>
            </button>
            <button id="close-btn" title="Close">
                <svg class="dock-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 6 12 12M6 18 18 6"></path></svg>
            </button>
        </div>
    </div>

    <div class="lyrics-section" style="display: none;">
        <div id="lyrics-container" class="lyrics-container"></div>
        <div class="lyrics-controls">
            <button id="lyrics-offset-minus-btn" title="Decrease Lyrics Delay (-0.1s)">
                <svg viewBox="0 0 24 24">
                    <path d="M19 13H5v-2h14v2z"></path>
                </svg>
            </button>
            <span id="lyrics-offset-display">0.0s</span>
            <button id="lyrics-offset-plus-btn" title="Increase Lyrics Delay (+0.1s)">
                <svg viewBox="0 0 24 24">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"></path>
                </svg>
            </button>
        </div>
    </div>
</div>

<script src="js/icons.js"></script>
<script src="js/audio/engine.js"></script>
<script src="js/native-popups.js"></script>
<script src="../shared/media-formats.js"></script>
<script src="js/renderer.js"></script>
</body>
</html>
